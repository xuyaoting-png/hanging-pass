name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22   # Astro 7 要求 Node >= 22.12
      - name: Install
        # 刻意不用 npm ci：本仓库不带锁文件。
        # 在 macOS 生成的锁文件不会包含 Linux 专用的可选二进制
        # （rolldown 的 binding-*.wasi/node 包），CI 上 npm ci 会直接崩。
        run: npm install --no-audit --no-fund
      - name: Build
        # 项目型 Pages 在子路径下，base 只在 CI 里加
        run: npm run build
        env:
          GITHUB_PAGES: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
